<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" role="img" aria-label="Falconer runtime stack: everything above the coordinator is the same for one vehicle or many">
  <title>Falconer runtime stack</title>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .box { fill: none; stroke: #b8b4aa; stroke-width: 1.25; }
    .group { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
    .proto { fill: #e6effa; stroke: #2f74d0; stroke-width: 2; }
    .video { fill: #fdebe4; stroke: #e5612b; stroke-width: 2; }
    .pervehicle { fill: #e2f4ee; stroke: #1f9e74; stroke-width: 2; }
    .planned { stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #b8b4aa; stroke-width: 1.25; }
    .edge-proto { fill: none; stroke: #2f74d0; stroke-width: 1.5; }
    .arrowhead-proto { fill: #2f74d0; }
    .arrowhead { fill: #b8b4aa; }
    .split { stroke: #1f9e74; stroke-width: 1.5; stroke-dasharray: 6 5; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12.5px; }
    .label { font-size: 13px; font-weight: 600; }
    .note { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .group { fill: #151b23; stroke: #3d444d; }
      .box, .edge { stroke: #5a5f66; }
      .arrowhead { fill: #5a5f66; }
      .edge-proto { stroke: #4c8fe8; }
      .arrowhead-proto { fill: #4c8fe8; }
      .proto { fill: #12243d; stroke: #4c8fe8; }
      .video { fill: #3a1d12; stroke: #f0794a; }
      .pervehicle { fill: #0f2e24; stroke: #35b88b; }
      .split { stroke: #35b88b; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrowhead"/>
    </marker>
    <marker id="arrow-proto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrowhead-proto"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="880" rx="12"/>
  <text class="title ink" x="24" y="36">Everything above the coordinator is the same for one vehicle or many</text>

  <!-- Tauri app -->
  <rect class="group" x="24" y="52" width="712" height="224" rx="12"/>
  <text class="label ink" x="40" y="76">Tauri app</text>

  <rect class="box planned" x="40" y="88" width="680" height="36" rx="8"/>
  <text class="sub ink" x="380" y="110" text-anchor="middle">Tauri shell: window, starts and owns the backend</text>

  <rect class="box planned" x="40" y="140" width="216" height="52" rx="8"/>
  <text class="name ink" x="148" y="162" text-anchor="middle">Views and pages</text>
  <text class="sub quiet" x="148" y="181" text-anchor="middle">Svelte 5, registries</text>

  <rect class="box planned" x="272" y="140" width="216" height="52" rx="8"/>
  <text class="name ink" x="380" y="162" text-anchor="middle">Primitives</text>
  <text class="sub quiet" x="380" y="181" text-anchor="middle">Themed Svelte components</text>

  <rect class="box planned" x="504" y="140" width="216" height="52" rx="8"/>
  <text class="name ink" x="612" y="162" text-anchor="middle">Map adapter</text>
  <text class="sub quiet" x="612" y="181" text-anchor="middle">Swappable engine and tiles</text>

  <rect class="proto planned" x="40" y="208" width="448" height="52" rx="8"/>
  <text class="name ink" x="264" y="230" text-anchor="middle">Generated client</text>
  <text class="sub quiet" x="264" y="249" text-anchor="middle">protobuf-es, TypeScript</text>

  <rect class="video planned" x="504" y="208" width="216" height="52" rx="8"/>
  <text class="name ink" x="612" y="230" text-anchor="middle">Video player</text>
  <text class="sub quiet" x="612" y="249" text-anchor="middle">WebRTC in the WebView</text>

  <rect class="video planned" x="520" y="312" width="200" height="52" rx="8"/>
  <text class="name ink" x="620" y="334" text-anchor="middle">Video component</text>
  <text class="sub quiet" x="620" y="353" text-anchor="middle">RTSP/RTP to WebRTC</text>
  <path class="edge" d="M620 312V262" marker-end="url(#arrow)"/>

  <!-- C++ backend -->
  <rect class="group" x="24" y="396" width="712" height="356" rx="12"/>
  <text class="label ink" x="720" y="416" text-anchor="end">C++ backend</text>

  <!-- Links between UI and backend -->
  <path class="edge-proto" d="M150 260V422" marker-start="url(#arrow-proto)" marker-end="url(#arrow-proto)"/>
  <text class="note ink" x="160" y="330">Protobuf over</text>
  <text class="note ink" x="160" y="346">loopback WebSocket</text>
  <text class="note quiet" x="160" y="362">commands and streams</text>

  <path class="edge planned" d="M380 260V422" marker-end="url(#arrow)"/>
  <text class="note ink" x="390" y="338">Manual control</text>
  <text class="note quiet" x="390" y="354">newest value wins</text>

  <rect class="proto" x="40" y="424" width="680" height="52" rx="8"/>
  <text class="name ink" x="380" y="446" text-anchor="middle">Contract server</text>
  <text class="sub quiet" x="380" y="465" text-anchor="middle">Handshake, version check, commands and streams</text>

  <rect class="box" x="40" y="492" width="680" height="52" rx="8"/>
  <text class="name ink" x="380" y="514" text-anchor="middle">Coordinator</text>
  <text class="sub quiet" x="380" y="533" text-anchor="middle">Owns the fleet: group commands, swarm, journal</text>

  <text class="note quiet" x="264" y="568" text-anchor="middle">Above: same for 1 or N vehicles</text>
  <line class="split" x1="40" y1="578" x2="720" y2="578"/>
  <text class="note quiet" x="264" y="596" text-anchor="middle">Below: one per vehicle</text>

  <rect class="pervehicle" x="40" y="608" width="216" height="52" rx="8"/>
  <text class="name ink" x="148" y="630" text-anchor="middle">Adapter, vehicle 1</text>
  <text class="sub quiet" x="148" y="649" text-anchor="middle">MAVSDK, one stream</text>

  <rect class="pervehicle" x="272" y="608" width="216" height="52" rx="8"/>
  <text class="name ink" x="380" y="630" text-anchor="middle">Adapter, vehicle 2</text>
  <text class="sub quiet" x="380" y="649" text-anchor="middle">MAVSDK, one stream</text>

  <rect class="pervehicle" x="504" y="608" width="216" height="52" rx="8"/>
  <text class="name ink" x="612" y="630" text-anchor="middle">Adapter, vehicle N</text>
  <text class="sub quiet" x="612" y="649" text-anchor="middle">MAVSDK, one stream</text>

  <rect class="box" x="40" y="684" width="680" height="52" rx="8"/>
  <text class="name ink" x="380" y="706" text-anchor="middle">Connection layer</text>
  <text class="sub quiet" x="380" y="725" text-anchor="middle">Radios, UDP, serial: one MAVLink stream per vehicle</text>

  <!-- Vehicles -->
  <rect class="box" x="40" y="784" width="216" height="36" rx="8"/>
  <text class="sub ink" x="148" y="806" text-anchor="middle">PX4 vehicle 1</text>
  <rect class="box" x="272" y="784" width="216" height="36" rx="8"/>
  <text class="sub ink" x="380" y="806" text-anchor="middle">PX4 vehicle 2</text>
  <rect class="box" x="504" y="784" width="216" height="36" rx="8"/>
  <text class="sub ink" x="612" y="806" text-anchor="middle">PX4 vehicle N</text>

  <!-- Connectors -->
  <g class="edge">
    <path d="M380 476V490" marker-end="url(#arrow)"/>
    <path d="M148 544V606" marker-end="url(#arrow)"/>
    <path d="M380 544V606" marker-end="url(#arrow)"/>
    <path d="M612 544V606" marker-end="url(#arrow)"/>
    <path d="M148 660V682" marker-end="url(#arrow)"/>
    <path d="M380 660V682" marker-end="url(#arrow)"/>
    <path d="M612 660V682" marker-end="url(#arrow)"/>
    <path d="M148 736V782" marker-end="url(#arrow)"/>
    <path d="M380 736V782" marker-end="url(#arrow)"/>
    <path d="M612 736V782" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <rect class="proto" x="40" y="844" width="14" height="14" rx="3"/>
  <text class="note quiet" x="62" y="856">Speaks protobuf</text>
  <rect class="video" x="178" y="844" width="14" height="14" rx="3"/>
  <text class="note quiet" x="200" y="856">Video, separate path</text>
  <rect class="pervehicle" x="342" y="844" width="14" height="14" rx="3"/>
  <text class="note quiet" x="364" y="856">One per vehicle</text>
  <rect class="box planned" x="482" y="844" width="14" height="14" rx="3"/>
  <text class="note quiet" x="504" y="856">Dashed: not built yet</text>
</svg>
